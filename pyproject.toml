[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avdb"
version = "0.1.0"
description = "Aviation Analytics Platform & Interactive Dashboard powered by BigQuery and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Steve Riffe" }
]
dependencies = [
    "streamlit>=1.38.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.26.0",
    "db-dtypes>=1.3.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "polars>=1.6.0",
    "duckdb>=1.0.0",
    "plotly>=5.24.0",
    "pydeck>=0.9.1",
    "altair>=5.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*", "analytics*"]
exclude = ["docker*", "data*"]
