name: Automated BTS & OD40 Pipeline Freshness Audit

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:      # Manual on-demand trigger

jobs:
  audit-freshness:
    name: Check BTS & OD40 Data Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-cloud-storage pyarrow pandas

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Pipeline Freshness Audit
        run: |
          python scripts/check_bts_updates.py
